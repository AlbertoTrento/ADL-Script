###########################################
# Additional Macros for Creality K1 Series
###########################################

[respond]

[virtual_pins]

[output_pin ADAPTIVE_BED_MESH]
pin: virtual_pin:ADAPTIVE_BED_MESH_pin
value: 1

[output_pin FULL_BED_MESH]
pin: virtual_pin:FULL_BED_MESH_pin
value: 0

[output_pin ADAPTIVE_PURGE_LINE]
pin: virtual_pin:ADAPTIVE_PURGE_LINE_pin
value: 1


# The choices made in the KAMP settings menus are saved in variables.cfg (same file
# as Save Z-Offset) and restored when Klipper starts, so they survive a restart.
[save_variables]
filename: /usr/data/printer_data/config/Helper-Script/variables.cfg

[delayed_gcode _KAMP_LOAD_SETTINGS]
initial_duration: 2
gcode:
  {% set saved = printer.save_variables.variables %}
  {% if saved.kamp_bed_mesh is defined %}
    {% if saved.kamp_bed_mesh|int == 1 %}
      SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=1
      SET_PIN PIN=FULL_BED_MESH VALUE=0
    {% elif saved.kamp_bed_mesh|int == 2 %}
      SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=0
      SET_PIN PIN=FULL_BED_MESH VALUE=1
    {% else %}
      SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=0
      SET_PIN PIN=FULL_BED_MESH VALUE=0
    {% endif %}
  {% endif %}
  {% if saved.kamp_purge_line is defined %}
    SET_PIN PIN=ADAPTIVE_PURGE_LINE VALUE={saved.kamp_purge_line|int}
  {% endif %}


[gcode_macro _ADAPTIVE_BED_MESH_ON]
description: Enable Adaptive Bed Mesh and Disable Full Bed Mesh
gcode:
  SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=1
  SET_PIN PIN=FULL_BED_MESH VALUE=0
  SAVE_VARIABLE VARIABLE=kamp_bed_mesh VALUE=1
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _FULL_BED_MESH_ON]
description: Disable Adaptive Bed Mesh and Enable Full Bed Mesh
gcode:
  SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=0
  SET_PIN PIN=FULL_BED_MESH VALUE=1
  SAVE_VARIABLE VARIABLE=kamp_bed_mesh VALUE=2
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _BED_MESH_OFF]
description: Disable Adaptive Bed Mesh and Enable Full Bed Mesh
gcode:
  SET_PIN PIN=ADAPTIVE_BED_MESH VALUE=0
  SET_PIN PIN=FULL_BED_MESH VALUE=0
  SAVE_VARIABLE VARIABLE=kamp_bed_mesh VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _ADAPTIVE_PURGE_LINE_ON]
description: Enable Adaptive Purge Line
gcode:
  SET_PIN PIN=ADAPTIVE_PURGE_LINE VALUE=1
  SAVE_VARIABLE VARIABLE=kamp_purge_line VALUE=1
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro _ADAPTIVE_PURGE_LINE_OFF]
description: Disable Adaptive Purge Line
gcode:
  SET_PIN PIN=ADAPTIVE_PURGE_LINE VALUE=0
  SAVE_VARIABLE VARIABLE=kamp_purge_line VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro KAMP_BED_MESH_SETTINGS]
description: Configure Bed Mesh type
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Bed Mesh Settings"
  RESPOND TYPE=command MSG="action:prompt_text What type of bed mesh do you want to use when you start printing?"
  RESPOND TYPE=command MSG="action:prompt_button ADAPTIVE BED MESH|_ADAPTIVE_BED_MESH_ON|primary"
  RESPOND TYPE=command MSG="action:prompt_button FULL BED MESH|_FULL_BED_MESH_ON|primary"
  RESPOND TYPE=command MSG="action:prompt_button NONE|_BED_MESH_OFF|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro KAMP_PURGE_LINE_SETTINGS]
description: Configure Purge Line type
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Purge Line Settings"
  RESPOND TYPE=command MSG="action:prompt_text What type of purge line do you want to use when you start printing?"
  RESPOND TYPE=command MSG="action:prompt_button ADAPTIVE PURGE LINE|_ADAPTIVE_PURGE_LINE_ON|primary"
  RESPOND TYPE=command MSG="action:prompt_button CLASSIC PURGE LINE|_ADAPTIVE_PURGE_LINE_OFF|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro START_PRINT]
variable_prepare: 0
variable_temp_ugello: 0
gcode:
  BOX_START_PRINT
  G90
  WAIT_TEMP_END
  CLEAR_PAUSE
  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %}
  
  {% if 'BED_TEMP' in params|upper and (params.BED_TEMP|float) %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}
  
  {% if 'EXTRUDER_TEMP' in params|upper and (params.EXTRUDER_TEMP|float) %}
    {% set extruder_temp = params.EXTRUDER_TEMP %}
  {% endif %}
  # Temperatura di stampa dello slicer, riusata da ADAPT_PURGE_MOD dopo il caricamento del CFS
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=temp_ugello VALUE={extruder_temp}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    {action_respond_info("not prepare.\n")}
    PRINT_PREPARE_CLEAR
    CX_ROUGH_G28 EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
    # Pulizia ugello con le temperature (senza, il letto andava a zero). Piatto: almeno 50, ma se e' gia' piu' caldo
    # si usa quello che ha, cosi' non aspetta che si raffreddi; mai sopra la temperatura di stampa.
    {% set piatto_ora = printer.heater_bed.temperature|int %}
    CX_NOZZLE_CLEAR EXTRUDER_TEMP={extruder_temp} BED_TEMP={[bed_temp|int, [piatto_ora, 50]|max]|min}
    M140 S{bed_temp}
    ACCURATE_G28
    {% if printer['output_pin ADAPTIVE_BED_MESH'].value == 1 %}
      RESPOND TYPE=command MSG="Starting Adaptive Bed Mesh..."
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE
      BED_MESH_PROFILE SAVE=adaptive
      BED_MESH_PROFILE LOAD=adaptive
    {% else %}
      {% if printer['output_pin FULL_BED_MESH'].value == 0 and (not printer['bed_mesh'].profile_name) %}
        RESPOND TYPE=command MSG="No bed mesh found. Starting Full Bed Mesh..."
        CX_PRINT_LEVELING_CALIBRATION
      {% endif %}
      {% if printer['output_pin FULL_BED_MESH'].value == 1 %}
        RESPOND TYPE=command MSG="Starting Full Bed Mesh..."
        CX_PRINT_LEVELING_CALIBRATION
      {% endif %}
      BED_MESH_PROFILE LOAD=default
    {% endif %}
  {% else %}
    PRINT_PREPARE_CLEAR
  {% endif %}


  M140 S{bed_temp}
[gcode_macro _CARICA_BOBINA_ESTERNA]
description: Bobina esterna: porta il filamento all'ugello, spurga nel vassoio e pulisce l'ugello
gcode:
  {% set temp = params.TEMP|default(220)|int %}
  {% set z_ora = printer.toolhead.position.z|float %}
  SAVE_GCODE_STATE NAME=carica_esterna
  RESPOND TYPE=command MSG="Bobina esterna: caricamento del filamento..."
  # Piatto basso prima di andare al vassoio
  {% if z_ora < 30 %}
    G91
    G0 Z{30 - z_ora} F3000
  {% endif %}
  G90
  G0 X148.5 F5000
  M400
  G0 Y225 F5000
  M400
  M109 S{temp}
  M83
  G1 E100 F600
  M400
  G1 E-5 F600
  M400
  # Punta del filamento fredda, poi pulizia sulla spazzola
  M109 S{temp - 40}
  SET_PIN PIN=fan0 VALUE=128
  G4 P4000
  SET_PIN PIN=fan0 VALUE=0
  G4 P3000
  M400
  PS_NOCFS_CLEAN_BRUSH
  RESTORE_GCODE_STATE NAME=carica_esterna

[gcode_macro ADAPT_PURGE_MOD]
gcode:
  # Il CFS carica alla sua temperatura (Tn_extrude_temp di box.cfg): prima dello spurgo si torna a quella di stampa e si aspetta
  {% set temp_ugello = printer['gcode_macro START_PRINT'].temp_ugello|int %}
  # Bobina esterna (CFS escluso): il filamento e' stato infilato a mano fino all'estrusore, qui si porta all'ugello
  {% if printer.box.enable|int == 0 %}
    _CARICA_BOBINA_ESTERNA TEMP={temp_ugello if temp_ugello > 0 else 220}
  {% endif %}
  {% if temp_ugello > 0 %}
    M109 S{temp_ugello}
  {% endif %}
  {% if printer['output_pin ADAPTIVE_PURGE_LINE'].value == 1 %}
    _SMART_PARK
    RESPOND TYPE=command MSG="Starting Adaptive Purge Line..."
    _LINE_PURGE
  {% else %}  
    RESPOND TYPE=command MSG="Starting Classic Purge Line..."
    CX_PRINT_DRAW_ONE_LINE
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
