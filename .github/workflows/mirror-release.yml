name: Mirror release
on:
  release:
    types: [published]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file della release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir assets
      - name: Nome fisso al setup
        run: |
          mapfile -t installers < <(find assets -maxdepth 1 -type f -iname '*.exe' -print)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::La release deve contenere un solo installer .exe"
            exit 1
          fi
          target="assets/${{ github.event.repository.name }}-setup.exe"
          if [ "${installers[0]}" != "$target" ]; then
            mv -- "${installers[0]}" "$target"
          fi
      - name: Pubblica sul repo pubblico
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NOTES: ${{ github.event.release.body }}
        run: |
          printf '%s' "$NOTES" > notes.md
          gh release create "${{ github.event.release.tag_name }}" assets/* --repo "AlbRelic/${{ github.event.repository.name }}" --title "${{ github.event.release.name }}" --notes-file notes.md
